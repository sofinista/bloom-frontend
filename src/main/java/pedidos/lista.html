<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: cabeza('Pedidos')}"></head>
<body>
<header th:replace="~{fragments/plantilla :: menu('pedidos')}"></header>

<main class="contenedor">
    <div class="encabezado">
        <h1>Pedidos</h1>
        <a th:href="@{/pedidos/nuevo}" class="boton">+ Nuevo pedido</a>
    </div>

    <div th:replace="~{fragments/plantilla :: alertas}"></div>

    <div class="tarjeta">
        <form th:action="@{/pedidos}" method="get" class="formulario">
            <div class="campo">
                <label for="estado">Estado</label>
                <select id="estado" name="estado">
                    <option value="">Todos</option>
                    <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"
                            th:selected="${e == estadoElegido}">REGISTRADO</option>
                </select>
            </div>
            <div class="campo">
                <label for="idCliente">Cliente</label>
                <select id="idCliente" name="idCliente">
                    <option value="">Todos</option>
                    <option th:each="c : ${clientes}" th:value="${c.idCliente}" th:text="${c.nombre}"
                            th:selected="${c.idCliente == clienteElegido}">Laura</option>
                </select>
            </div>
            <div class="botones-formulario">
                <button type="submit" class="boton boton-verde">Filtrar</button>
                <a th:href="@{/pedidos}" class="boton boton-borde">Quitar filtros</a>
            </div>
        </form>
    </div>

    <div class="tarjeta tabla-scroll">
        <table>
            <thead>
            <tr>
                <th>#</th>
                <th>Cliente</th>
                <th>Entrega</th>
                <th>Ocasión</th>
                <th>Estado</th>
                <th>Total</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="pedido : ${pedidos}">
                <td th:text="${pedido.idPedido}">1</td>
                <td th:text="${nombres[pedido.idCliente]} ?: ('Cliente #' + ${pedido.idCliente})">Laura</td>
                <td th:text="${#temporals.format(pedido.fechaHoraEntrega, 'dd/MM/yyyy HH:mm')}">30/11/2026 10:00</td>
                <td th:text="${pedido.ocasion} ?: '-'">Cumpleaños</td>
                <td><span class="etiqueta" th:classappend="'estado-' + ${pedido.estado}" th:text="${pedido.estado}">REGISTRADO</span></td>
                <td th:text="'$ ' + ${#numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 0, 'COMMA')}">$ 120.000</td>
                <td><a th:href="@{/pedidos/{id}(id=${pedido.idPedido})}" class="boton boton-borde boton-chico">Ver</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(pedidos)}">
                <td colspan="7" class="vacio">No hay pedidos con esos filtros.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/plantilla :: pie}"></footer>
</body>
</html>
