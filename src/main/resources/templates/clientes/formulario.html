<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: cabeza('Cliente')}"></head>
<body>
<header th:replace="~{fragments/plantilla :: menu('clientes')}"></header>

<main class="contenedor">
    <div class="encabezado">
        <h1 th:text="${cliente.idCliente == null} ? 'Nuevo cliente' : 'Editar cliente'">Nuevo cliente</h1>
    </div>

    <div th:replace="~{fragments/plantilla :: alertas}"></div>

    <div class="tarjeta">
        <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post" class="formulario">
            <input type="hidden" th:field="*{idCliente}">

            <div class="campo campo-ancho">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" th:field="*{nombre}" required placeholder="Laura Gómez">
            </div>
            <div class="campo">
                <label for="tipoDocumento">Tipo de documento</label>
                <select id="tipoDocumento" th:field="*{tipoDocumento}" required>
                    <option value="">Selecciona...</option>
                    <option value="CC">Cédula de ciudadanía (CC)</option>
                    <option value="CE">Cédula de extranjería (CE)</option>
                    <option value="PASAPORTE">Pasaporte</option>
                </select>
            </div>
            <div class="campo">
                <label for="numeroDocumento">Número de documento</label>
                <input type="text" id="numeroDocumento" th:field="*{numeroDocumento}" required placeholder="1037654321">
            </div>
            <div class="campo">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" th:field="*{telefono}" required placeholder="3001234567">
            </div>
            <div class="campo">
                <label for="correoElectronico">Correo electrónico</label>
                <input type="email" id="correoElectronico" th:field="*{correoElectronico}" placeholder="laura@correo.com">
            </div>
            <div class="campo campo-ancho">
                <label for="direccion">Dirección</label>
                <input type="text" id="direccion" th:field="*{direccion}" placeholder="Calle 10 # 43-20, Medellín">
            </div>

            <div class="botones-formulario">
                <button type="submit" class="boton">Guardar cliente</button>
                <a th:href="@{/clientes}" class="boton boton-borde">Cancelar</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/plantilla :: pie}"></footer>
</body>
</html>
