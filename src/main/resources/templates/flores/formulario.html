<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: cabeza('Flor')}"></head>
<body>
<header th:replace="~{fragments/plantilla :: menu('flores')}"></header>

<main class="contenedor">
    <div class="encabezado">
        <h1 th:text="${flor.idFlor == null} ? 'Nueva flor' : 'Editar flor'">Nueva flor</h1>
    </div>

    <div th:replace="~{fragments/plantilla :: alertas}"></div>

    <div class="tarjeta">
        <form th:action="@{/flores/guardar}" th:object="${flor}" method="post" class="formulario">
            <input type="hidden" th:field="*{idFlor}">

            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" th:field="*{nombre}" required placeholder="Rosa">
            </div>
            <div class="campo">
                <label for="color">Color</label>
                <input type="text" id="color" th:field="*{color}" required placeholder="Rojo">
            </div>
            <div class="campo">
                <label for="precioUnitario">Precio unitario</label>
                <input type="number" id="precioUnitario" th:field="*{precioUnitario}" required min="1" step="any" placeholder="3500">
            </div>
            <div class="campo" th:if="${flor.idFlor == null}">
                <label for="stock">Stock inicial</label>
                <input type="number" id="stock" th:field="*{stock}" required min="0" placeholder="50">
            </div>
            <input type="hidden" th:if="${flor.idFlor != null}" th:field="*{stock}">

            <div class="botones-formulario">
                <button type="submit" class="boton">Guardar flor</button>
                <a th:href="@{/flores}" class="boton boton-borde">Cancelar</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/plantilla :: pie}"></footer>
</body>
</html>
